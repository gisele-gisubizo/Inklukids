  <script>
  (function (global) {
    const STORAGE_KEY = 'inklukids_proto_v4';
    const SESSION_KEY = 'inklukids_proto_session_v4';
    const LATENCY_MS  = 350;

    const seed = {
      users: [
        { id: 'u1', name: 'Gisele Ishimirwe', email: 'gisele@gmail.com', password: 'test@123', role: 'teacher', grades: ['P3','P4'] },
        { id: 'u2', name: 'Stacy Mukamana',   email: 'stacy@gmail.com',  password: 'test@123', role: 'teacher', grades: ['P5'] },
        { id: 'u3', name: 'Gisubizo Uwase',   email: 'gisubizo@gmail.com', password: 'try@123', role: 'parent',  children: ['u5','u6'] },
        { id: 'u4', name: 'Jean Mugabo',      email: 'j.mugabo@admin.com', password: 'try@123', role: 'admin' },
        { id: 'u5', name: 'Olga Ineza',       email: 'olga@gmail.com',   password: 'try@123', role: 'child',   grade: 'P3', parentId: 'u3', points: 240 },
        { id: 'u6', name: 'Tiffany Keza',     email: 'tiffany@gmail.com',password: 'try@123', role: 'child',   grade: 'P4', parentId: 'u3', points: 180 },
      ],
      activities: [
        { id: 'a1', title: 'Daily Greeting Routine',    category: 'Social Skills',     points: 10, grade: 'P3', createdBy: 'u1' },
        { id: 'a2', title: 'Colour Matching Game',      category: 'Cognitive',         points: 15, grade: 'P3', createdBy: 'u1' },
        { id: 'a3', title: 'Storytime: The Lost Bird',  category: 'Language',          points: 20, grade: 'P4', createdBy: 'u1' },
        { id: 'a4', title: 'Calm-down Breathing',       category: 'Emotional',         points: 10, grade: 'P3', createdBy: 'u2' },
        { id: 'a5', title: 'Counting With Beads',       category: 'Math',              points: 15, grade: 'P4', createdBy: 'u2' },
        { id: 'a6', title: 'Picture Communication',     category: 'Communication',     points: 20, grade: 'P5', createdBy: 'u2' },
      ],
      assignments: [
        { id: 'as1', activityId: 'a1', assignedTo: 'u5', assignedBy: 'u1', status: 'completed', dueDate: '2026-05-10', completedAt: '2026-05-09', assignedAt: '2026-05-08T10:00:00' },
        { id: 'as2', activityId: 'a2', assignedTo: 'u5', assignedBy: 'u1', status: 'in-progress', dueDate: '2026-05-16', assignedAt: '2026-05-11T10:00:00' },
        { id: 'as3', activityId: 'a3', assignedTo: 'u6', assignedBy: 'u1', status: 'pending',     dueDate: '2026-05-18', assignedAt: '2026-05-12T10:00:00' },
        { id: 'as4', activityId: 'a4', assignedTo: 'u5', assignedBy: 'u2', status: 'pending',     dueDate: '2026-05-20', assignedAt: '2026-05-12T14:00:00' },
      ],
      supportRequests: [
        { id: 'sr1', childName: 'Olga Ineza', message: 'The colour matching game feels a bit hard today.', category: 'learning', status: 'new' },
      ],
      childSupportByChild: { u5: [], u6: [] },
      parentTraining: [
        { id: 'pt1', moduleTitle: 'Supporting routines at home', moduleDescription: 'Short guidance module assigned by your teacher.', status: 'assigned', assignedByName: 'Gisele Ishimirwe', moduleLink: 'https://youtu.be/yyagWY5QF2Q' },
      ],
      weeklyProgress: [
        { week: 'W1', score: 45 }, { week: 'W2', score: 56 }, { week: 'W3', score: 63 }, { week: 'W4', score: 72 },
      ],
      activityBreakdown: [
        { name: 'Visual cards', done: 8 }, { name: 'Reading', done: 5 }, { name: 'Interactive', done: 7 },
      ],
      teacherTrainingCompletion: [
        { name: 'Teacher A', done: 6, total: 6 }, { name: 'Teacher B', done: 4, total: 6 }, { name: 'Teacher C', done: 3, total: 6 }, { name: 'Teacher D', done: 1, total: 6 },
      ],
      teacherTrainingAssignments: [],
      messages: [
        { id: 'm1', from: 'u1', to: 'u3', text: 'Hello! Olga did great on her greeting routine today.',  at: '2026-05-13T09:14:00' },
        { id: 'm2', from: 'u3', to: 'u1', text: 'Thank you so much! She practiced over the weekend.',    at: '2026-05-13T09:22:00' },
        { id: 'm3', from: 'u1', to: 'u3', text: 'Tomorrow we will start the colour matching activity.',  at: '2026-05-13T09:24:00' },
        { id: 'm4', from: 'u2', to: 'u3', text: 'Please review the calm-down breathing video at home.',  at: '2026-05-12T16:10:00' },
      ],
      announcements: [
        { id: 'an1', title: 'Inclusive Education Workshop', body: 'Join us Saturday for a hands-on workshop on inclusive classrooms.', date: '2026-05-18', authorId: 'u4', audience: 'all', createdAt: '2026-05-14T08:00:00', createdByName: 'Jean Mugabo', createdByRole: 'admin' },
        { id: 'an2', title: 'New Activities Added', body: 'Six new activities published for grades P3-P5.', date: '2026-05-12', authorId: 'u4', audience: 'all', createdAt: '2026-05-12T10:00:00', createdByName: 'Jean Mugabo', createdByRole: 'admin' },
      ],
    };

    function load() {
      try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
      save(seed); return JSON.parse(JSON.stringify(seed));
    }
    function save(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {} }
    function delay(v) { return new Promise((r) => setTimeout(() => r(v), LATENCY_MS)); }
    function uid(p) { return p + Math.random().toString(36).slice(2, 9); }
    function getSession() { try { const r = localStorage.getItem(SESSION_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
    function setSession(u) { if (u) localStorage.setItem(SESSION_KEY, JSON.stringify(u)); else localStorage.removeItem(SESSION_KEY); }

    global.MockDB = {
      login(email, password) {
        const s = load();
        const u = s.users.find((x) => x.email.toLowerCase() === String(email||'').toLowerCase().trim() && x.password === password);
        if (!u) return delay(Promise.reject(new Error('Incorrect email or password.')));
        const safe = { ...u }; delete safe.password; setSession(safe); return delay(safe);
      },
      register(opts) {
        const s = load();
        const name = (opts && opts.name) || '';
        const email = (opts && opts.email) || '';
        const password = (opts && opts.password) || '';
        const role = (opts && opts.role) || '';
        if (!name.trim() || !email.trim() || !password || !role) return delay(Promise.reject(new Error('All fields are required.')));
        if (password.length < 6) return delay(Promise.reject(new Error('Password must be at least 6 characters.')));
        if (s.users.some((u) => u.email.toLowerCase() === email.toLowerCase().trim())) return delay(Promise.reject(new Error('Email already registered.')));
        const em = email.toLowerCase().trim();
        const grades = role === 'teacher'
          ? String((opts && opts.teachesGrades) || '').split(',').map((x) => x.trim()).filter(Boolean)
          : [];
        const gradeChild = String((opts && opts.gradeLevel) || (opts && opts.grade) || '').trim();
        const childProfiles = (opts && opts.childProfiles) || null;
        const u = {
          id: uid('u'),
          name: name.trim(),
          email: em,
          password,
          role,
          ...(role === 'child' ? { grade: gradeChild || 'P1', points: 0 } : {}),
          ...(role === 'parent' ? { children: [], ...(childProfiles ? { registrationChildren: childProfiles } : {}) } : {}),
          ...(role === 'teacher' ? { grades } : {}),
        };
        s.users.push(u); save(s); const safe = { ...u }; delete safe.password; setSession(safe); return delay(safe);
      },
      logout() { setSession(null); return delay(true); },
      currentUser() { return getSession(); },
      listUsers()         { return delay(load().users.map((u)=>{const c={...u};delete c.password;return c;})); },
      listActivities()    { return delay(load().activities); },
      listAssignments()   { return delay(load().assignments); },
      listMessages()      { return delay(load().messages); },
      listAnnouncements() { return delay(load().announcements); },
      createActivity({ title, category, points, grade, createdBy }) {
        if (!title || !category) return delay(Promise.reject(new Error('Title and category required.')));
        const s = load(); const a = { id: uid('a'), title: title.trim(), category, points: Number(points)||10, grade: grade||'P3', createdBy };
        s.activities.push(a); save(s); return delay(a);
      },
      createAssignment({ activityId, assignedTo, assignedBy, dueDate }) {
        if (!activityId || !assignedTo) return delay(Promise.reject(new Error('Activity and learner required.')));
        const s = load(); const a = { id: uid('as'), activityId, assignedTo, assignedBy, status: 'pending', dueDate: dueDate||null };
        s.assignments.push(a); save(s); return delay(a);
      },
      completeAssignment(id) {
        const s = load(); const as = s.assignments.find((x)=>x.id===id);
        if (!as) return delay(Promise.reject(new Error('Assignment not found.')));
        as.status = 'completed'; as.completedAt = new Date().toISOString().slice(0,10);
        const child = s.users.find((u)=>u.id===as.assignedTo); const act = s.activities.find((x)=>x.id===as.activityId);
        if (child && act) child.points = (child.points||0) + (act.points||0);
        save(s); return delay(as);
      },
      sendMessage({ from, to, text }) {
        if (!text || !text.trim()) return delay(Promise.reject(new Error('Message cannot be empty.')));
        const s = load(); const m = { id: uid('m'), from, to, text: text.trim(), at: new Date().toISOString() };
        s.messages.push(m); save(s); return delay(m);
      },
      createAnnouncement({ title, body, authorId, audience }) {
        if (!title || !body) return delay(Promise.reject(new Error('Title and body required.')));
        const s = load();
        const author = s.users.find((u) => u.id === authorId);
        const a = {
          id: uid('an'), title: title.trim(), body: body.trim(),
          date: new Date().toISOString().slice(0,10), authorId,
          audience: audience || 'all',
          createdAt: new Date().toISOString(),
          createdByName: author ? author.name : 'School',
          createdByRole: author ? author.role : 'admin',
        };
        s.announcements.unshift(a); save(s); return delay(a);
      },
      listSupportRequests() { return delay(load().supportRequests || []); },
      addSupportRequest({ childId, category, message }) {
        const s = load(); const u = s.users.find((x) => x.id === childId);
        const r = { id: uid('sr'), childName: u ? u.name : 'Child', message: String(message || '').trim(), category: category || 'learning', status: 'new' };
        if (!r.message) return delay(Promise.reject(new Error('Message required.')));
        s.supportRequests = [r, ...(s.supportRequests || [])];
        save(s); return delay(r);
      },
      listParentTraining() { return delay(load().parentTraining || []); },
      getWeeklyProgress() { return delay({ weekly: load().weeklyProgress, breakdown: load().activityBreakdown }); },
      getTeacherTrainingRows() {
        const s = load();
        const teachers = (s.users || []).filter((u) => u.role === 'teacher');
        const demo = s.teacherTrainingCompletion || [];
        if (!teachers.length) return delay(demo);
        const rows = teachers.map((t, i) => {
          const slot = demo[i % demo.length] || { done: 0, total: 6 };
          return { id: t.id, name: t.name, done: slot.done, total: slot.total };
        });
        return delay(rows);
      },
      listTeacherTrainingAssignments() { return delay(load().teacherTrainingAssignments || []); },
      assignTeacherTraining({ assigneeUserId, moduleTitle, moduleDescription, moduleLink, assignedBy }) {
        const title = String(moduleTitle || '').trim();
        if (!assigneeUserId || !title) return delay(Promise.reject(new Error('Select a teacher and enter a module title.')));
        const s = load();
        const assigner = (s.users || []).find((u) => u.id === assignedBy);
        const assignee = (s.users || []).find((u) => u.id === assigneeUserId);
        const row = {
          id: uid('tta'),
          assigneeUserId,
          assigneeName: assignee ? assignee.name : 'Teacher',
          moduleTitle: title,
          moduleDescription: String(moduleDescription || '').trim(),
          moduleLink: String(moduleLink || '').trim() || undefined,
          assignedBy,
          assignedByName: assigner ? assigner.name : 'Admin',
          assignedAt: new Date().toISOString(),
          status: 'assigned',
        };
        s.teacherTrainingAssignments = s.teacherTrainingAssignments || [];
        s.teacherTrainingAssignments.unshift(row);
        save(s);
        return delay(row);
      },
      completeParentTraining(id) {
        const s = load(); const t = (s.parentTraining || []).find((x) => x.id === id);
        if (t) { t.status = 'completed'; save(s); }
        return delay(t || null);
      },
      deleteUser(id) { const s = load(); s.users = s.users.filter((u)=>u.id!==id); save(s); return delay(true); },
      reset() { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(SESSION_KEY); return delay(true); },
    };
  })(window);
  </script>

  function useHashRoute() {
    const [route, setRoute] = useState(() => window.location.hash.replace(/^#/, '') || '/');

      window.addEventListener('hashchange', h);
      return () => window.removeEventListener('hashchange', h);
    }, []);
    const nav = useCallback((p) => { window.location.hash = p; }, []);
    return [route, nav];

  const ToastCtx = React.createContext(null);
  function ToastProvider({ children }) {
    const [toasts, setToasts] = useState([]);
    const push = useCallback((text, kind = 'info') => {
      const id = Math.random().toString(36).slice(2);
      setToasts((t) => [...t, { id, text, kind }]);
      setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
    }, []);
    return (
      <ToastCtx.Provider value={push}>
        {children}
        <div className="toast-wrap">
          {toasts.map((t) => <div key={t.id} className={`toast ${t.kind}`}>{t.text}</div>)}
        </div>
      </ToastCtx.Provider>
    );
  }

  function Login({ nav, onAuth }) {
    const toast = useToast();
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    async function submit(e) {
      e.preventDefault();
      setErr('');
      const em = String(email || '').trim();
      const pw = String(password || '').trim();
      if (!em || !pw) { setErr('Please fill in all fields.'); return; }
      setBusy(true);
      try {
        const u = await DB.login(em, pw);
        onAuth(u);
        toast(`Welcome back, ${u.name.split(' ')[0]}!`, 'success');
        nav(homePathFor(u.role));
      } catch (ex) {
        setErr(ex.message);
      } finally {
        setBusy(false);
      }
    }
    return (
      <div className="auth-page">
        <div className="auth-left">
          <button type="button" className="auth-back" onClick={() => nav('/')}>
            <I name="arrow_left" size={14} /> Back to home
          </button>
          <div className="auth-brand">InkluKids</div>
          <h2>Welcome back</h2>
          <p className="auth-sub">Sign in to your account.</p>
          <form onSubmit={submit}>
            <div className="auth-field">
              <label>Email</label>
              <input type="email" placeholder="you@example.com" value={email} onChange={(e) => setEmail(e.target.value)} autoFocus />
            </div>
            <div className="auth-field">
              <label>Password</label>
              <input type="password" placeholder="Your password" value={password} onChange={(e) => setPassword(e.target.value)} />
            </div>
            {err && <div className="auth-error">{err}</div>}
            <button type="submit" className="auth-submit" disabled={busy}>{busy ? 'Signing in…' : 'Sign In'}</button>
          </form>
          <p className="auth-switch">
            No account? <span role="button" tabIndex={0} onClick={() => nav('/register')} onKeyDown={(e) => e.key === 'Enter' && nav('/register')}>Create one</span>
          </p>

            <div style={{ marginTop: 8, lineHeight: 1.6 }}>

          <div className="auth-proto-demos">
            <DemoAccountsPanel />
          </div>
        </div>
        <AuthMarketingPanel />
      </div>

  function Register({ nav, onAuth }) {
    const toast = useToast();
    const [step, setStep] = useState(1);
    const [form, setForm] = useState({ name: '', email: '', password: '', confirm: '', role: 'teacher', gradeLevel: '', teachesGrades: '' });
    const [children, setChildren] = useState([{ name: '', age: '', grade: '', diagnosis: '', school: '', notes: '' }]);
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const set = (k, v) => { setForm((p) => ({ ...p, [k]: v })); setErr(''); };
    const setChild = (i, k, v) => setChildren((p) => p.map((c, idx) => (idx === i ? { ...c, [k]: v } : c)));
    const addChild = () => setChildren((p) => [...p, { name: '', age: '', grade: '', diagnosis: '', school: '', notes: '' }]);
    const removeChild = (i) => setChildren((p) => p.filter((_, idx) => idx !== i));

    const normalizedEmail = (form.email || '').trim().toLowerCase();
    const normalizedPassword = (form.password || '').trim();
    const normalizedConfirm = (form.confirm || '').trim();
    const normalizedName = (form.name || '').trim();

    async function handleStep1(e) {
      e.preventDefault();
      setErr('');
      if (!normalizedName || !normalizedEmail || !normalizedPassword || !normalizedConfirm) {
        setErr('Please fill in all fields.');
        return;
      }
      if (!normalizedEmail.includes('@') || normalizedEmail.split('@')[1]?.includes('.') !== true) {
        setErr('Please enter a valid email.');
        return;
      }
      if (normalizedPassword.length < 6) {
        setErr('Password must be at least 6 characters.');
        return;
      }
      if (normalizedPassword !== normalizedConfirm) {
        setErr('Passwords do not match.');
        return;
      }
      if (form.role === 'child' && !String(form.gradeLevel || '').trim()) {
        setErr('Please enter grade / class level.');
        return;
      }
      if (form.role === 'teacher' && !String(form.teachesGrades || '').trim()) {
        setErr('Please enter grades you teach.');
        return;
      }
      const existing = await DB.listUsers();
      if (existing.some((u) => (u.email || '').toLowerCase() === normalizedEmail)) {
        setErr('An account with this email already exists.');
        return;
      }
      if (form.role === 'parent') {
        setStep(2);
        return;
      }
      setBusy(true);
      try {
        const u = await DB.register({
          name: normalizedName,
          email: normalizedEmail,
          password: normalizedPassword,
          role: form.role,
          gradeLevel: form.role === 'child' ? String(form.gradeLevel || '').trim() : undefined,
          teachesGrades: form.role === 'teacher' ? form.teachesGrades : undefined,
        });
        onAuth(u);
        toast('Account created — welcome to InkluKids!', 'success');
        nav(homePathFor(u.role));
      } catch (ex) {
        setErr(ex.message);
      } finally {
        setBusy(false);
      }
    }

    async function handleStep2(e) {
      e.preventDefault();
      setErr('');
      if (children.some((c) => !String(c.name || '').trim())) {
        setErr('Please enter a name for each child.');
        return;
      }
      const existing = await DB.listUsers();
      if (existing.some((u) => (u.email || '').toLowerCase() === normalizedEmail)) {
        setErr('An account with this email already exists.');
        return;
      }
      setBusy(true);
      try {
        const profiles = children.map((c) => ({
          name: c.name.trim(),
          age: c.age,
          grade: c.grade,
          diagnosis: c.diagnosis,
          school: c.school,
          notes: c.notes,
        }));
        const u = await DB.register({
          name: normalizedName,
          email: normalizedEmail,
          password: normalizedPassword,
          role: 'parent',
          childProfiles: profiles,
        });
        onAuth(u);
        toast('Account created — welcome to InkluKids!', 'success');
        nav(homePathFor(u.role));
      } catch (ex) {
        setErr(ex.message);
      } finally {
        setBusy(false);
      }
    }

    return (
      <div className="auth-page">
        <div className="auth-left">
          <button type="button" className="auth-back" onClick={() => (step === 2 ? setStep(1) : nav('/'))}>
            <I name="arrow_left" size={14} /> {step === 2 ? 'Back' : 'Back to home'}
          </button>
          <div className="auth-brand">InkluKids</div>

          {step === 1 && (
            <>
              <h2>Create your account</h2>
              <p className="auth-sub">Free to join. No credit card needed.</p>
              <form onSubmit={handleStep1}>
                <div className="auth-field">
                  <label>Full Name</label>
                  <input type="text" placeholder="Your full name" value={form.name} onChange={(e) => set('name', e.target.value)} />
                </div>
                <div className="auth-field">
                  <label>Email</label>
                  <input type="email" placeholder="you@example.com" value={form.email} onChange={(e) => set('email', e.target.value)} />
                </div>
                <div className="auth-field">
                  <label>I am a</label>
                  <div className="auth-roles">
                    {[{ v: 'teacher', l: 'Teacher' }, { v: 'parent', l: 'Parent' }, { v: 'child', l: 'Child' }, { v: 'admin', l: 'Admin' }].map((r) => (
                      <button key={r.v} type="button" className={'auth-role-btn' + (form.role === r.v ? ' active' : '')} onClick={() => set('role', r.v)}>
                        {r.l}
                      </button>
                    ))}
                  </div>
                </div>
                {form.role === 'child' && (
                  <div className="auth-field">
                    <label>Grade / Class level</label>
                    <input value={form.gradeLevel} onChange={(e) => set('gradeLevel', e.target.value)} placeholder="e.g. P3, Grade 4, S1" />
                  </div>
                )}
                {form.role === 'teacher' && (
                  <div className="auth-field">
                    <label>Grades you teach</label>
                    <input value={form.teachesGrades} onChange={(e) => set('teachesGrades', e.target.value)} placeholder="e.g. P1, P2, P3 (comma-separated)" />
                  </div>
                )}
                <div className="auth-field">
                  <label>Password</label>
                  <input type="password" placeholder="At least 6 characters" value={form.password} onChange={(e) => set('password', e.target.value)} />
                </div>
                <div className="auth-field">
                  <label>Confirm Password</label>
                  <input type="password" placeholder="Repeat your password" value={form.confirm} onChange={(e) => set('confirm', e.target.value)} />
                </div>
                {err && <div className="auth-error">{err}</div>}
                <button type="submit" className="auth-submit" disabled={busy}>
                  {busy ? 'Please wait…' : form.role === 'parent' ? 'Next — Add child info' : 'Create Account'}
                </button>
              </form>
              <p className="auth-switch">
                Already have an account? <span role="button" tabIndex={0} onClick={() => nav('/login')} onKeyDown={(e) => e.key === 'Enter' && nav('/login')}>Sign in</span>
              </p>
              <p className="auth-proto-note">Prototype: new accounts are stored in this browser only. For quick access, use the demo table on Sign in.</p>
            </>
          )}

          {step === 2 && (
            <>
              <h2>About your child</h2>
              <p className="auth-sub">This helps us personalise activities for your family.</p>
              <div className="auth-steps">
                <span className="auth-step done">1. Account</span>
                <span className="auth-step-arrow">→</span>
                <span className="auth-step active">2. Child info</span>
              </div>
              <form onSubmit={handleStep2}>
                {children.map((child, i) => (
                  <div className="auth-child-block" key={i}>
                    <div className="auth-child-header">
                      <span>Child {i + 1}</span>
                      {children.length > 1 && (
                        <button type="button" className="auth-child-remove" onClick={() => removeChild(i)}>
                          Remove
                        </button>
                      )}
                    </div>
                    <div className="auth-field-row">
                      <div className="auth-field">
                        <label>Name *</label>
                        <input type="text" placeholder="e.g. Child name" value={child.name} onChange={(e) => setChild(i, 'name', e.target.value)} />
                      </div>
                      <div className="auth-field">
                        <label>Age</label>
                        <input type="number" placeholder="e.g. 7" min="2" max="18" value={child.age} onChange={(e) => setChild(i, 'age', e.target.value)} />
                      </div>
                    </div>
                    <div className="auth-field">
                      <label>Grade / Class level</label>
                      <input type="text" placeholder="e.g. P3, Grade 4" value={child.grade} onChange={(e) => setChild(i, 'grade', e.target.value)} />
                    </div>
                    <div className="auth-field">
                      <label>School</label>
                      <input type="text" placeholder="e.g. Kigali Primary School" value={child.school} onChange={(e) => setChild(i, 'school', e.target.value)} />
                    </div>
                    <div className="auth-field">
                      <label>Support needs</label>
                      <div className="auth-checks">
                        {['Autism Spectrum', 'ADHD', 'Speech Delay', 'Sensory Processing', 'Other'].map((d) => (
                          <label key={d} className="auth-check-label">
                            <input
                              type="checkbox"
                              checked={(child.diagnosis || '').includes(d)}
                              onChange={(e) => {
                                const cur = child.diagnosis ? child.diagnosis.split(', ').filter(Boolean) : [];
                                setChild(i, 'diagnosis', (e.target.checked ? [...cur, d] : cur.filter((x) => x !== d)).join(', '));
                              }}
                            />
                            {d}
                          </label>
                        ))}
                      </div>
                    </div>
                    <div className="auth-field">
                      <label>
                        Notes <span className="auth-optional">(optional)</span>
                      </label>
                      <textarea placeholder="e.g. prefers visual instructions, sensitive to noise…" value={child.notes} onChange={(e) => setChild(i, 'notes', e.target.value)} rows={3} />
                    </div>
                  </div>
                ))}
                <button type="button" className="auth-add-child" onClick={addChild}>
                  + Add another child
                </button>
                {err && <div className="auth-error">{err}</div>}
                <button type="submit" className="auth-submit" disabled={busy}>
                  {busy ? 'Please wait…' : 'Complete Registration'}
                </button>
              </form>
            </>
          )}
        </div>
        <AuthMarketingPanel />
      </div>
    );
  }

  function Shell({ user, route, nav, onLogout, menu, children }) {
    const [q, setQ] = useState('');

    const wrapRef = useRef(null);
    const active = menu.find((m) => m.path === route) || menu[0];
    const fi = user.name?.charAt(0) || '?';
    useEffect(() => {
      const fn = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setShowUserMenu(false); };
      document.addEventListener('mousedown', fn);
      return () => document.removeEventListener('mousedown', fn);
    }, []);
    const inner = (
      <div className="dashboard">
        <aside className="sidebar">
          <div className="sidebar-logo">InkluKids</div>
          <nav className="sidebar-nav">
            {menu.map((m) => (
              <button key={m.path} type="button" className={'nav-item' + (route === m.path ? ' active' : '')} onClick={() => nav(m.path)}>
                <I name={m.icon} size={17} /><span>{m.label}</span>
              </button>
            ))}
          </nav>
          <div className="sidebar-bottom">
            <div className="sidebar-user">
              <div className="s-av">{fi}</div>
              <div>
                <div className="s-name">{user.name}</div>
                <div className="s-role">{user.role}</div>
              </div>
            </div>
            <button type="button" className="s-logout" onClick={onLogout} title="Log out"><I name="logout" size={16} /></button>
          </div>
        </aside>
        <div className="main-wrap">
          <header className="topbar">
            <div className="topbar-title">{active?.label || ''}</div>
            <div className="topbar-right">
              <div className="topbar-search">
                <input placeholder="Search modules, resources, messages..." value={q} onChange={(e) => setQ(e.target.value)} />
              </div>
              <div className="notif-wrap">
                <button type="button" className="icon-btn" title="Notifications"><I name="bell" size={19} /></button>
              </div>
              <div className="topbar-user-wrap" ref={wrapRef}>
                <button type="button" className="topbar-user" onClick={() => setShowUserMenu((p) => !p)} aria-expanded={showUserMenu}>
                  <div className="topbar-user-av">{fi}</div>
                  <div>
                    <div className="topbar-user-name">{user.name}</div>
                    <div className="topbar-user-role">{user.role === 'admin' ? 'School Admin' : user.role}</div>
                  </div>
                </button>
                {showUserMenu && (
                  <div className="topbar-user-menu" role="menu">
                    <button type="button" className="topbar-user-menu-item" role="menuitem" onClick={() => { nav('/settings'); setShowUserMenu(false); }}>Profile</button>
                    <button type="button" className="topbar-user-menu-item danger" role="menuitem" onClick={() => { setShowUserMenu(false); onLogout(); }}>Logout</button>
                  </div>
                )}
              </div>
            </div>
          </header>
          <main className="main-content">{React.cloneElement(children, { searchQuery: q })}</main>
        </div>
      </div>
    );
    if (user.role === 'child') return <div className="child-app">{inner}</div>;
    return inner;
  }

    const activeWeek = useMemo(() => {
      const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const ids = new Set();
      for (const as of assignments) {
        if (as.status !== 'completed' || !as.completedAt) continue;
        const t = new Date(as.completedAt).getTime();
        if (!Number.isNaN(t) && t >= cutoff) ids.add(as.assignedTo);
      }
      return ids.size;
    }, [assignments]);
    return (
      <div className="page">
        <div className="page-head">
          <h1>School Overview</h1>

  function TrainingAssignPage({ user }) {
    const toast = useToast();
    const [people, setPeople] = useState([]);
    const [assigned, setAssigned] = useState([]);
    const [selectedUserId, setSelectedUserId] = useState('');
    const [moduleTitle, setModuleTitle] = useState('');
    const [moduleDescription, setModuleDescription] = useState('');
    const [moduleLink, setModuleLink] = useState('');
    const refreshPeople = useCallback(() => {
      DB.listUsers().then((list) => {
        const teachers = list.filter((p) => p.role === 'teacher');
        setPeople(teachers);
        setSelectedUserId((cur) => {
          if (cur && teachers.some((t) => t.id === cur)) return cur;
          return teachers[0]?.id || '';
        });
      });
    }, []);
    const refreshAssigned = useCallback(() => {
      DB.listTeacherTrainingAssignments().then(setAssigned);
    }, []);
    useEffect(() => {
      refreshPeople();
      refreshAssigned();
    }, [refreshPeople, refreshAssigned]);
    async function assign() {
      if (!selectedUserId || !moduleTitle.trim()) return;
      try {
        await DB.assignTeacherTraining({
          assigneeUserId: selectedUserId,
          moduleTitle: moduleTitle.trim(),
          moduleDescription: moduleDescription.trim(),
          moduleLink: moduleLink.trim(),
          assignedBy: user.id,
        });
        setModuleTitle('');
        setModuleDescription('');
        setModuleLink('');
        toast('Training assigned', 'success');
        refreshAssigned();
      } catch (ex) {
        toast(ex.message || 'Assignment failed', 'error');
      }
    }
    return (
      <div className="page">
        <div className="page-head">
          <h1>Assign Teacher Training</h1>
          <p>Admin assigns training modules to teachers.</p>
        </div>
        <div className="card assign-training-card">

            <div className="li-sub">No teacher accounts yet. Register a teacher or use seed accounts (e.g. Gisele Ishimirwe).</div>

                <label>Select teacher</label>
                <select value={selectedUserId} onChange={(e) => setSelectedUserId(e.target.value)}>
                  {people.map((p) => (
                    <option key={p.id} value={p.id}>{p.name} ({p.email})</option>

                </select>
              </div>
              <div className="auth-field">
                <label>Module title</label>
                <input value={moduleTitle} onChange={(e) => setModuleTitle(e.target.value)} placeholder="e.g. Visual Communication Basics" />
              </div>
              <div className="auth-field">
                <label>Description</label>
                <textarea rows={3} value={moduleDescription} onChange={(e) => setModuleDescription(e.target.value)} placeholder="What they should learn from this module" />
              </div>
              <div className="auth-field">
                <label>Resource/video link (optional)</label>
                <input value={moduleLink} onChange={(e) => setModuleLink(e.target.value)} placeholder="https://..." />
              </div>
              <div className="lesson-actions">
                <button type="button" className="btn-primary" onClick={assign} disabled={!selectedUserId || !moduleTitle.trim()}>
                  <I name="plus" size={16} /> Assign training
                </button>
              </div>
            </>
          )}
        </div>
        {!!assigned.length && (
          <div className="card" style={{ marginTop: 16 }}>
            <div className="card-title">Recently assigned</div>
            <div className="li-sub" style={{ marginBottom: 12 }}>Latest admin assignments (newest first).</div>

              <a className="btn-sm" href={'data:text/csv;charset=utf-8,' + encodeURIComponent(makeCsv(r.title))} download={r.title.replace(/[^a-z0-9]+/gi, '_').toLowerCase() + '.csv'}><I name="download" size={13} /> Download CSV</a>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function Activities({ user, searchQuery }) {
    const toast = useToast();
    const [items, setItems] = useState([]);
    const [loading, setLoading] = useState(true);
    const [filter, setFilter] = useState('');
    const [showModal, setShowModal] = useState(false);
    useEffect(() => { DB.listActivities().then((rows)=>{ setItems(rows); setLoading(false); }); }, []);
    const canCreate = user.role==='teacher' || user.role==='admin';
    const q = (searchQuery || filter).toLowerCase().trim();
    const filtered = q ? items.filter((a)=>a.title.toLowerCase().includes(q)||a.category.toLowerCase().includes(q)||a.grade.toLowerCase().includes(q)) : items;
    function handleCreated(a) { setItems((x)=>[...x,a]); toast(`Activity "${a.title}" added`,'success'); setShowModal(false); }
    return (
      <div className="page">
        <div className="page-head" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12, flexWrap: 'wrap' }}>
          <div>
            <h1>Activities</h1>
            <p>{canCreate ? 'Create and manage activities for children to complete.' : 'Browse and search the activity library.'}</p>
          </div>
          {canCreate && <button type="button" className="btn-primary" onClick={()=>setShowModal(true)}><I name="plus" size={14} /> New Activity</button>}
        </div>
        <div className="filter-row">
          <input className="filter-search" placeholder="Filter by title, category, or grade…" value={filter} onChange={(e)=>setFilter(e.target.value)} />
        </div>
        <div className="card" style={{padding:0}}>
          {loading && <div className="empty">Loading activities…</div>}
          {!loading && filtered.length===0 && <div className="empty"><I name="book" size={36} /><div>No activities match your search.</div></div>}
          {!loading && filtered.map((a) => (
            <div key={a.id} className="list-row">
              <div className="row-icon"><I name="book" /></div>
              <div className="row-main">
                <div className="row-title">{a.title}</div>
                <div className="row-sub">{a.category} · Grade {a.grade} · {a.points} pts</div>
              </div>
              <span className="badge blue">{a.category}</span>
            </div>
          ))}
        </div>
        {showModal && <ActivityModal user={user} onClose={()=>setShowModal(false)} onCreated={handleCreated} />}
      </div>
    );
  }

  function ActivityModal({ user, onClose, onCreated }) {
    const [form, setForm] = useState({ title:'', category:'Social Skills', points:10, grade:'P3' });
    const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
    const set = (k,v)=>setForm((f)=>({ ...f, [k]: v }));
    async function submit(e) {
      e.preventDefault(); setErr(''); setBusy(true);
      try { const a = await DB.createActivity({ ...form, createdBy: user.id }); onCreated(a); }
      catch (ex) { setErr(ex.message); } finally { setBusy(false); }
    }
    return (
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal" onClick={(e)=>e.stopPropagation()}>
          <form onSubmit={submit}>
            <div className="modal-header"><h3>New Activity</h3><button type="button" className="btn-ghost" onClick={onClose}><I name="x" size={16} /></button></div>
            <div className="modal-body">
              {err && <div className="form-error">{err}</div>}
              <div className="form-group"><label>Title</label><input value={form.title} onChange={(e)=>set('title',e.target.value)} placeholder="e.g. Picture matching" /></div>
              <div className="form-group"><label>Category</label>
                <select value={form.category} onChange={(e)=>set('category',e.target.value)}>
                  <option>Social Skills</option><option>Cognitive</option><option>Language</option><option>Emotional</option><option>Math</option><option>Communication</option>
                </select>
              </div>
              <div className="form-group"><label>Grade</label>
                <select value={form.grade} onChange={(e)=>set('grade',e.target.value)}>
                  <option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option>
                </select>
              </div>
              <div className="form-group"><label>Points</label><input type="number" min="1" max="100" value={form.points} onChange={(e)=>set('points',e.target.value)} /></div>
            </div>
            <div className="modal-footer">
              <button type="button" className="btn-secondary" onClick={onClose}>Cancel</button>
              <button type="submit" className="btn-primary" disabled={busy}>{busy?'Saving…':'Create activity'}</button>
            </div>
          </form>
        </div>
      </div>
    );
  }

  function Assignments({ user }) {
    const toast = useToast();
    const [state, setState] = useState({ assignments:[], activities:[], users:[], loading:true });
    const [showModal, setShowModal] = useState(false);
    async function refresh() {
      const [assignments, activities, users] = await Promise.all([DB.listAssignments(), DB.listActivities(), DB.listUsers()]);
      setState({ assignments, activities, users, loading:false });
    }
    useEffect(() => { refresh(); }, []);
    const mine = state.assignments.filter((a) => {
      if (user.role==='teacher') return a.assignedBy===user.id;
      if (user.role==='child')   return a.assignedTo===user.id;
      if (user.role==='parent')  return (user.children||[]).includes(a.assignedTo);
      return true;
    });
    async function markComplete(id) {
      try { await DB.completeAssignment(id); toast('Marked complete — points awarded.','success'); refresh(); }
      catch (ex) { toast(ex.message,'error'); }
    }
    return (
      <div className="page">
        <div className="page-head" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12, flexWrap: 'wrap' }}>
          <div>
            <h1>{user.role==='child'?'My Progress':user.role==='parent'?'My Children':'Assignments'}</h1>
            <p>{user.role==='teacher'?"Assignments you've issued to learners.":user.role==='child'?'Activities assigned to you. Mark them complete to earn points.':'Activities assigned to your children.'}</p>
          </div>
          {user.role==='teacher' && <button type="button" className="btn-primary" onClick={()=>setShowModal(true)}><I name="plus" size={14} /> New Assignment</button>}
        </div>
        <div className="card" style={{padding:0}}>
          {state.loading && <div className="empty">Loading…</div>}
          {!state.loading && mine.length===0 && <div className="empty"><I name="list" size={36} /><div>No assignments yet.</div></div>}
          {!state.loading && mine.length>0 && (
            <table className="tbl">
              <thead><tr><th>Activity</th><th>{user.role==='child'?'Points':'Learner'}</th><th>Due</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {mine.map((as) => {
                  const act = state.activities.find((a)=>a.id===as.activityId);
                  const learner = state.users.find((u)=>u.id===as.assignedTo);
                  return (
                    <tr key={as.id}>
                      <td><b>{act?.title||'—'}</b><div style={{fontSize:12,color:'var(--muted)'}}>{act?.category}</div></td>
                      <td>{user.role==='child'?`${act?.points||0} pts`:learner?.name||'—'}</td>
                      <td>{as.dueDate||'—'}</td>
                      <td><span className={`badge ${as.status==='completed'?'green':as.status==='in-progress'?'amber':'blue'}`}>{as.status}</span></td>
                      <td style={{textAlign:'right'}}>{as.status!=='completed' && user.role==='child' && <button className="btn-sm" onClick={()=>markComplete(as.id)}>Mark complete</button>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
        {showModal && <AssignmentModal user={user} activities={state.activities} learners={state.users.filter((u)=>u.role==='child')}
          onClose={()=>setShowModal(false)} onCreated={()=>{ toast('Assignment created.','success'); setShowModal(false); refresh(); }} />}
      </div>
    );
  }

  function AssignmentModal({ user, activities, learners, onClose, onCreated }) {
    const [form, setForm] = useState({ activityId: activities[0]?.id||'', assignedTo: learners[0]?.id||'', dueDate:'' });
    const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
    const set = (k,v)=>setForm((f)=>({ ...f, [k]: v }));
    async function submit(e) {
      e.preventDefault(); setErr(''); setBusy(true);
      try { const a = await DB.createAssignment({ ...form, assignedBy: user.id }); onCreated(a); }
      catch (ex) { setErr(ex.message); } finally { setBusy(false); }
    }
    return (
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal" onClick={(e)=>e.stopPropagation()}>
          <form onSubmit={submit}>
            <div className="modal-header"><h3>New Assignment</h3><button type="button" className="btn-ghost" onClick={onClose}><I name="x" size={16} /></button></div>
            <div className="modal-body">
              {err && <div className="form-error">{err}</div>}
              <div className="form-group"><label>Activity</label>
                <select value={form.activityId} onChange={(e)=>set('activityId',e.target.value)}>{activities.map((a)=><option key={a.id} value={a.id}>{a.title}</option>)}</select>
              </div>
              <div className="form-group"><label>Learner</label>
                <select value={form.assignedTo} onChange={(e)=>set('assignedTo',e.target.value)}>{learners.map((l)=><option key={l.id} value={l.id}>{l.name} ({l.grade})</option>)}</select>
              </div>
              <div className="form-group"><label>Due date</label><input type="date" value={form.dueDate} onChange={(e)=>set('dueDate',e.target.value)} /></div>
            </div>
            <div className="modal-footer">
              <button type="button" className="btn-secondary" onClick={onClose}>Cancel</button>
              <button type="submit" className="btn-primary" disabled={busy}>{busy?'Saving…':'Create assignment'}</button>
            </div>
          </form>
        </div>
      </div>
    );
  }

  function Messages({ user }) {
    const toast = useToast();
    const [state, setState] = useState({ messages:[], users:[], loading:true });
    const [activeId, setActiveId] = useState(null);
    const [text, setText] = useState('');
    async function refresh() { const [messages, users] = await Promise.all([DB.listMessages(), DB.listUsers()]); setState({ messages, users, loading:false }); }
    useEffect(() => { refresh(); }, []);
    const conversations = useMemo(() => {
      const map = new Map();
      state.messages.forEach((m) => {
        if (m.from!==user.id && m.to!==user.id) return;
        const other = m.from===user.id ? m.to : m.from;
        const prev = map.get(other);
        if (!prev || new Date(m.at) > new Date(prev.at)) map.set(other, m);
      });
      return Array.from(map.entries()).map(([other,last])=>({ otherId:other, user:state.users.find((u)=>u.id===other), last })).filter((c)=>c.user);
    }, [state.messages, state.users, user.id]);
    useEffect(() => { if (!activeId && conversations.length) setActiveId(conversations[0].otherId); }, [conversations, activeId]);
    const thread = state.messages.filter((m)=>(m.from===user.id&&m.to===activeId)||(m.from===activeId&&m.to===user.id)).sort((a,b)=>new Date(a.at)-new Date(b.at));
    const other = state.users.find((u)=>u.id===activeId);
    async function send() {
      if (!text.trim() || !activeId) return;
      try { await DB.sendMessage({ from:user.id, to:activeId, text }); setText(''); refresh(); }
      catch (ex) { toast(ex.message,'error'); }
    }
    return (
      <div className="page">
        <div className="page-head"><h1>Messages</h1><p>Communicate securely with parents and teachers.</p></div>
        {state.loading ? <div className="empty">Loading messages…</div> :
         conversations.length === 0 ? <div className="card empty"><I name="msg" size={36} /><div>No conversations yet.</div></div> : (
         <div className="chat-layout">
           <div className="chat-list">
             {conversations.map((c) => (
               <button key={c.otherId} type="button" className={'chat-list-item' + (c.otherId === activeId ? ' active' : '')} onClick={() => setActiveId(c.otherId)}>
                 <div className="chat-list-avatar">{c.user.name.charAt(0)}</div>
                 <div className="chat-list-meta">
                   <div className="chat-list-top">
                     <div className="li-title">{c.user.name}</div>
                     <div className="chat-list-time">{new Date(c.last.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>
                   </div>
                   <div className="li-sub chat-list-preview">{c.last.text}</div>
                 </div>
               </button>
             ))}
           </div>
           <div className="chat-shell">
             <div className="chat-header">
               <div className="chat-header-title">{other?.name || 'Messages'}</div>
               <div className="chat-header-sub">{other?.role ? String(other.role).charAt(0).toUpperCase() + String(other.role).slice(1) : ''}</div>
             </div>
             <div className="chat-msgs">
               {thread.map((m) => (
                 <div key={m.id} className={'bwrap ' + (m.from === user.id ? 'right' : 'left')}>
                   <div className="bname">{m.from === user.id ? 'You' : other?.name}</div>
                   <div className={'bubble ' + (m.from === user.id ? 'bmine' : 'btheirs')}>{m.text}</div>
                   <div className="btime">{new Date(m.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>
                 </div>
               ))}
             </div>
             <div className="chat-input">
               <input value={text} onChange={(e) => setText(e.target.value)} placeholder="Type a message..." />
               <button type="button" className="btn-primary" onClick={send}><I name="send" size={16} /></button>
             </div>
           </div>
         </div>
        )}
      </div>
    );
  }

  function Announcements({ user }) {
    const toast = useToast();
    const [items, setItems] = useState([]);
    const [loading, setLoading] = useState(true);
    const [showModal, setShowModal] = useState(false);
    async function refresh() { const r = await DB.listAnnouncements(); setItems(r); setLoading(false); }
    useEffect(() => { refresh(); }, []);
    const canPost = user.role === 'admin' || user.role === 'teacher';
    return (
      <div className="page">
        <div className="page-head"><h1>Announcements</h1><p>School-wide updates for teachers and parents.</p></div>
        {canPost && (
          <div style={{ marginBottom: 12 }}>
            <button type="button" className="btn-primary" onClick={() => setShowModal(true)}><I name="plus" size={14} /> New Announcement</button>
          </div>
        )}
        {loading && <div className="empty">Loading…</div>}
        {!loading && items.length === 0 && <div className="card"><div className="li-sub">No announcements yet.</div></div>}
        {!loading && items.length > 0 && (
          <div className="card">
            <div className="card-title">Recent announcements</div>
            <div className="res-grid" style={{ marginTop: 10 }}>
              {items.map((a) => (
                <div key={a.id} className="res-card">
                  <div className="res-top">
                    <Badge label={a.audience === 'all' ? 'All' : a.audience === 'teachers' ? 'Teachers' : 'Parents'} type="blue" />
                    <span className="res-cat">{annDate(a)}</span>
                  </div>
                  <div className="res-title">{a.title}</div>
                  <div className="res-desc">{a.body}</div>
                  <div className="li-sub">By {a.createdByName || 'School'} ({a.createdByRole || 'admin'})</div>
                </div>
              ))}
            </div>
          </div>
        )}
        {showModal && <AnnouncementModal user={user} onClose={() => setShowModal(false)} onCreated={() => { toast('Announcement posted.', 'success'); setShowModal(false); refresh(); }} />}
      </div>
    );
  }

  function AnnouncementModal({ user, onClose, onCreated }) {
    const [form, setForm] = useState({ title: '', body: '', audience: 'all' });
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
    async function submit(e) {
      e.preventDefault(); setErr(''); setBusy(true);
      try { await DB.createAnnouncement({ title: form.title, body: form.body, authorId: user.id, audience: form.audience }); onCreated(); }
      catch (ex) { setErr(ex.message); } finally { setBusy(false); }
    }
    return (
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal" onClick={(e) => e.stopPropagation()}>
          <form onSubmit={submit}>
            <div className="modal-header"><h3>New Announcement</h3><button type="button" className="btn-ghost" onClick={onClose}><I name="x" size={16} /></button></div>
            <div className="modal-body">
              {err && <div className="form-error">{err}</div>}
              <div className="form-group"><label>Title</label><input value={form.title} onChange={(e) => set('title', e.target.value)} placeholder="e.g. Parent Meeting Friday" /></div>
              <div className="form-group"><label>Message</label><textarea rows="4" value={form.body} onChange={(e) => set('body', e.target.value)} placeholder="Write your announcement..." /></div>
              <div className="form-group"><label>Audience</label>
                <select value={form.audience} onChange={(e) => set('audience', e.target.value)}>
                  <option value="all">All</option>
                  <option value="teachers">Teachers only</option>
                  <option value="parents">Parents only</option>
                </select>
              </div>
            </div>
            <div className="modal-footer">
              <button type="button" className="btn-secondary" onClick={onClose}>Cancel</button>
              <button type="submit" className="btn-primary" disabled={busy || !form.title.trim() || !form.body.trim()}>{busy ? 'Posting…' : 'Post announcement'}</button>
            </div>
          </form>
        </div>
      </div>
    );
  }

  function Users({ user, searchQuery }) {
    const toast = useToast();
    const [items, setItems] = useState([]); const [loading, setLoading] = useState(true);
    const [filter, setFilter] = useState('all');
    async function refresh() { const r = await DB.listUsers(); setItems(r); setLoading(false); }
    useEffect(() => { refresh(); }, []);
    const q = (searchQuery||'').toLowerCase().trim();
    const filtered = items.filter((u)=>filter==='all'||u.role===filter).filter((u)=>!q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q));
    async function remove(id) {
      if (id===user.id) { toast("You can't delete your own account.",'error'); return; }
      if (!window.confirm('Delete this user?')) return;
      await DB.deleteUser(id); toast('User deleted.','success'); refresh();
    }
    return (
      <div className="page">
        <div className="page-head" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12, flexWrap: 'wrap' }}>
          <div><h1>User Management</h1><p>Manage all accounts on the platform.</p></div>
          <select className="btn-secondary" value={filter} onChange={(e)=>setFilter(e.target.value)}>
            <option value="all">All</option><option value="teacher">teacher</option><option value="parent">parent</option><option value="child">child</option><option value="admin">admin</option>
          </select>
        </div>
        <div className="card" style={{padding:0}}>
          {loading && <div className="empty">Loading…</div>}
          {!loading && filtered.length===0 && <div className="empty">No users match.</div>}
          {!loading && filtered.length>0 && (
            <table className="tbl">
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Details</th><th></th></tr></thead>
              <tbody>
                {filtered.map((u) => (
                  <tr key={u.id}>
                    <td><b>{u.name}</b></td>
                    <td>{u.email}</td>
                    <td><span className="badge blue">{u.role}</span></td>
                    <td style={{fontSize:13,color:'var(--muted)'}}>
                      {u.role==='child' && `Grade ${u.grade||'—'} · ${u.points||0} pts`}
                      {u.role==='teacher' && `Teaches: ${(u.grades||[]).join(', ')||'—'}`}
                      {u.role==='parent' && `${(u.children||[]).length} children linked`}
                      {u.role==='admin' && 'System administrator'}
                    </td>
                    <td style={{textAlign:'right'}}><button className="btn-danger" onClick={()=>remove(u.id)}>Delete</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    );
  }

  function App() {
    const [route, nav] = useHashRoute();
    const [user, setUser] = useState(() => DB.currentUser());
    const menu = useMemo(() => navMenuForRole(user?.role || ''), [user?.role]);
    const allowed = useMemo(() => new Set((menu || []).map((m) => m.path).concat(['/settings'])), [menu]);
    const isPublic = route === '/' || route === '/login' || route === '/register';
    useEffect(() => {
      if (!user && !isPublic) nav('/login');
      if (user && (route === '/login' || route === '/register' || route === '/')) nav(homePathFor(user.role));
      if (user && route !== '/' && !allowed.has(route)) nav(homePathFor(user.role));
    }, [user, route, isPublic, nav, allowed]);
    async function handleLogout() { await DB.logout(); setUser(null); nav('/'); }
    if (!user) {
      if (route === '/login') return <Login nav={nav} onAuth={setUser} />;
      if (route === '/register') return <Register nav={nav} onAuth={setUser} />;
      return <Landing nav={nav} />;
    }
    let screen;
    switch (route) {
      case '/dashboard': screen = <Dashboard user={user} nav={nav} />; break;
      case '/overview': screen = <AdminOverview user={user} />; break;
      case '/training':
        screen = user.role === 'parent' ? <ParentTrainingPage /> : user.role === 'admin' ? <TrainingAssignPage user={user} /> : <TrainingModulesPage user={user} />;
        break;
      case '/training-assign': screen = <TrainingAssignPage user={user} />; break;
      case '/students': screen = <StudentsPage />; break;
      case '/activities': screen = <Activities user={user} />; break;
      case '/resources': screen = <ResourcesPage />; break;
      case '/messages': screen = <Messages user={user} />; break;
      case '/announcements': screen = <Announcements user={user} />; break;
      case '/settings': screen = <SettingsPage user={user} onLogout={handleLogout} />; break;
      case '/assignments': screen = <Assignments user={user} />; break;
      case '/assigned': screen = user.role === 'parent' ? <ParentAssignedPage user={user} /> : <ChildAssignedOnly user={user} />; break;
      case '/progress':
        screen = user.role === 'parent' ? <ProgressParentPage user={user} /> : user.role === 'child' ? <ChildProgressPage user={user} /> : <ProgressChartsPage />;
        break;
      case '/learn': screen = <ChildLearnPage user={user} />; break;
      case '/help': screen = <ChildHelpPage user={user} />; break;
      case '/awards': screen = <ChildAwardsPage user={user} />; break;
      case '/users': screen = user.role === 'admin' ? <Users user={user} /> : <Dashboard user={user} nav={nav} />; break;
      case '/reports': screen = <ReportsPage />; break;
      case '/feedback': screen = <FeedbackPage />; break;
      default: screen = <Dashboard user={user} nav={nav} />;
    }
    return <Shell user={user} route={route} nav={nav} onLogout={handleLogout} menu={menu}>{screen}</Shell>;
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ToastProvider><App /></ToastProvider>);
  </script>
</body>
</html>
